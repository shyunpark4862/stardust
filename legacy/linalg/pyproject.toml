[build-system]
requires = ["scikit-build-core>=1.1", "nanobind>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "stardust-linalg"
version = "0.0.1"
description = "An educational linear algebra library on top of stardust-numpy, wrapping Accelerate LAPACK"
requires-python = ">=3.15"
dependencies = ["stardust-numpy"]

[project.optional-dependencies]
test = ["pytest", "hypothesis", "numpy", "scipy"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/stardust_linalg"]
# Editable installs rebuild the C++ core on import when sources changed.
editable.rebuild = true
editable.verbose = false

[tool.pytest.ini_options]
testpaths = ["tests"]
